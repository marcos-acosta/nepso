[project]
name = "nepso"
version = "0.1.0"
description = "ESC/POS printing for the EPSON TM-m30 with image dithering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=12.2.0",
    "pyusb>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nepso"]
